<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>a page for you</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="top-bar">
    <div>Happy Birthday</div>
    <div>The World Got Better Today</div>
  </div>

  <section class="hero">

    <div class="hero-top">
      <span>07-05-2026</span>
      <span>sasa's special day</span>
      <span>by. Seiji</span>
    </div>

    <div class="heart-icon">💗</div>

    <div class="special-song">A Special Little Page</div>

    <h1 class="main-title">About Her</h1>

    <div class="names">
      <span>Natasya</span>
    </div>

    <div class="gift-wrapper">
      <div class="line"></div>
      <div class="gift-btn">made with love</div>
      <div class="line"></div>
    </div>

    <div class="album-section">

      <div class="bg-text">HappyBirthday</div>

      <div class="album-container">

        <button class="arrow" onclick="prevSlide()">‹</button>

        <div class="album">
          <div class="cd"></div>

          <div class="cover">
            <img src="sasa.jpg">
          </div>

          <div class="album-shadow"></div>
        </div>

        <button class="arrow" onclick="nextSlide()">›</button>

      </div>
    </div>

    <div class="desc" id="slideContent"></div>

    <div class="bottom-buttons">
      <button class="page-btn">NEXT PAGE</button>
      <button class="page-btn white">NEW PROJECT</button>
    </div>

  </section>

  <div class="paper"></div>

  <script src="script.js"></script>
</body>
</html>
